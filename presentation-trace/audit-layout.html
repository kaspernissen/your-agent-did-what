<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Trace deck — layout audit</title>
<link rel="stylesheet" href="fonts/fonts.css">
<link rel="stylesheet" href="trace.css">
<style>
  /* Render every slide at authored size, unscaled, so measurements are literal. */
  body{margin:0;background:#333}
  .stage{position:relative;width:1920px;height:1080px;overflow:visible}
  #out{position:fixed;left:0;top:0;z-index:9999;background:#fff;color:#000;
       font:12px monospace;white-space:pre;max-height:100vh;overflow:auto}
</style>
</head>
<body>
<pre id="out">running…</pre>
<div id="host"></div>
<script>
/* Layout audit for the Trace deck.
 *
 * The conformance checker (check-deck.py) works on markup and cannot see
 * geometry, so overflow and text-on-text collisions have escaped it twice.
 * This page renders each slide at its authored 1920x1080, unscaled, and
 * measures real bounding boxes.
 *
 * Reports two failure classes:
 *   OVERFLOW — a text element extends past the slide's bounds
 *   OVERLAP  — two text elements occupy the same pixels
 *
 * KNOWN BLIND SPOT: <text> inside one <svg> is not compared against its
 * siblings, because they all resolve to the same block ancestor. A diagram
 * whose labels collide with each other will pass. Look at SVG slides.
 *
 * Run headless:  chrome --headless --dump-dom http://localhost:PORT/audit-layout.html
 */
const SLIDE_W = 1920, SLIDE_H = 1080, PAD = 4;

function isText(el){
  if (!el.textContent || !el.textContent.trim()) return false;
  // only leaf-ish nodes — a wrapper's box is not itself ink on the slide
  return ![...el.children].some(c => c.textContent && c.textContent.trim());
}

function overlaps(a, b){
  return !(a.right - PAD <= b.left || b.right - PAD <= a.left ||
           a.bottom - PAD <= b.top || b.bottom - PAD <= a.top);
}

(async () => {
  const res = await fetch('index.html', {cache:'no-store'});
  const doc = new DOMParser().parseFromString(await res.text(), 'text/html');
  const sections = [...doc.querySelectorAll('deck-stage > section')];
  const host = document.getElementById('host');
  const findings = [];

  sections.forEach((sec, i) => {
    const stage = document.createElement('div');
    stage.className = 'stage';
    const clone = sec.cloneNode(true);
    clone.style.position = 'absolute';
    clone.style.inset = '0';
    stage.appendChild(clone);
    host.appendChild(stage);

    const label = sec.getAttribute('data-label') || '(no label)';
    const stageBox = stage.getBoundingClientRect();
    // Two inline fragments of the SAME sentence (an <em> and a highlighted
    // <span> in one paragraph) legitimately have intersecting boxes once the
    // text wraps. Group by nearest block-level ancestor so we only compare
    // things that are actually separate blocks of text on the slide.
    // Start at the element itself: a block-level node is its OWN group, so two
    // sibling <p>s are still compared. Only inline nodes walk up to their block.
    // (Starting at parentElement collapsed every top-level <p> into the section
    // and silently disabled overlap detection entirely.)
    const blockOf = (el) => {
      let n = el;
      while (n && n !== clone && getComputedStyle(n).display.startsWith('inline')) n = n.parentElement;
      return n || clone;
    };
    const texts = [...clone.querySelectorAll('*')].filter(isText).map(el => {
      const r = el.getBoundingClientRect();
      return {
        el, block: blockOf(el),
        text: el.textContent.trim().slice(0, 44),
        left: r.left - stageBox.left, top: r.top - stageBox.top,
        right: r.right - stageBox.left, bottom: r.bottom - stageBox.top,
      };
    });

    for (const t of texts){
      if (t.bottom > SLIDE_H + PAD || t.right > SLIDE_W + PAD ||
          t.top < -PAD || t.left < -PAD){
        findings.push(`slide ${i+1} [${label}] OVERFLOW  bottom=${Math.round(t.bottom)} right=${Math.round(t.right)}  "${t.text}"`);
      }
    }
    // Text must also stay inside any panel it sits on. Slide-bounds checks miss
    // this entirely: a bio overflowing its card is still well inside the slide.
    // Every surface that PAINTS a background, not just .chamfer cards. Text can
    // land on a code block's padding without touching the <pre> inside it: the
    // text-vs-text pass sees no collision, but the slide shows a caption sitting
    // on a dark panel. Slides 23 and 37 both shipped that way and audited CLEAN.
    const panels = [...clone.querySelectorAll('.chamfer, .code-block')].map(el => {
      const r = el.getBoundingClientRect();
      return {el, left:r.left-stageBox.left, top:r.top-stageBox.top,
              right:r.right-stageBox.left, bottom:r.bottom-stageBox.top};
    });
    for (const p of panels){
      for (const t of texts){
        const cx = (t.left + t.right) / 2;
        // must BEGIN inside the panel — text deliberately placed below one
        // (the L04 attribution line) is not an escape.
        const startsInside = cx > p.left && cx < p.right &&
                             t.top >= p.top - PAD && t.top < p.bottom - PAD;
        if (startsInside && t.bottom > p.bottom + PAD){
          findings.push(`slide ${i+1} [${label}] ESCAPES PANEL  text bottom=${Math.round(t.bottom)} > panel bottom=${Math.round(p.bottom)}  "${t.text}"`);
        }
      }
    }

    // Text overlapping a painted surface it does not belong to. Descendants are
    // the panel's own content and are expected; anything else is ink on a box.
    for (const p of panels){
      for (const t of texts){
        if (p.el.contains(t.el)) continue;
        // Text laid fully INSIDE a panel is a deliberate overlay (the Who
        // slide's bios sit on their card as positioned siblings). The defect is
        // text that STRADDLES a panel edge — a caption drifting up onto a box.
        const fullyInside = t.left >= p.left - PAD && t.right <= p.right + PAD &&
                            t.top  >= p.top  - PAD && t.bottom <= p.bottom + PAD;
        if (fullyInside) continue;
        if (overlaps(t, p)){
          findings.push(`slide ${i+1} [${label}] ON PANEL  "${t.text}"  sits on a ${p.el.className.split(' ')[0]} box`);
        }
      }
    }

    for (let a = 0; a < texts.length; a++){
      for (let b = a+1; b < texts.length; b++){
        if (texts[a].block === texts[b].block) continue;   // same paragraph
        if (overlaps(texts[a], texts[b])){
          findings.push(`slide ${i+1} [${label}] OVERLAP   "${texts[a].text}"  ×  "${texts[b].text}"`);
        }
      }
    }
    host.removeChild(stage);
  });

  document.getElementById('out').textContent =
    (findings.length ? findings.join('\n') : 'CLEAN — no overflow or overlap') +
    `\n\n${sections.length} slides audited, ${findings.length} finding(s).`;
})();
</script>
</body>
</html>
