<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Trace deck — element model</title>
<link rel="stylesheet" href="fonts/fonts.css">
<link rel="stylesheet" href="trace.css">
<style>
  body{margin:0;background:#333}
  /* Must be a real <deck-stage>, not a div: trace.css scopes the body font,
     padding and colour to `deck-stage > section`. Cloning into a div left every
     inherited run in the browser default, which showed up as "Times" in the type
     census and — worse — mis-measured every content-sized card. */
  deck-stage.stage{display:block;position:relative;width:1920px;height:1080px;overflow:visible}
  #out{position:fixed;left:0;top:0;z-index:9999;background:#fff;color:#000;
       font:11px monospace;white-space:pre;max-height:100vh;overflow:auto}
</style>
</head>
<body>
<pre id="out">running…</pre>
<div id="host"></div>
<script>
/* Element model for the Google Slides export.
 *
 * Walks every slide and records, in slide coordinates, the bounding box of
 * every element worth shipping as its own PNG — diagrams, cards, code panels,
 * placed images, decorative panels — plus all the text in reading order.
 *
 * Geometry comes from getBoundingClientRect on a real render, not from parsing
 * the inline styles, so flex layout, wrapping and the chamfer clip are all
 * accounted for. Emitted as JSON for the Python cropper to consume.
 */
/* A fixed selector list missed most of the deck: the s3 timeline is a gradient
   background on a div plus four bordered nodes, and nothing in
   `svg, .chamfer, .code-block, img` matches that. Detect PAINT instead — anything
   that draws a background, an image, a border, a clip-path, a shadow, or a
   painting ::before/::after. */
const ALPHA = (c) => !(!c || c === "transparent" || /rgba\([^)]*,\s*0\s*\)$/.test(c));

function paintsPseudo(el, which){
  const cs = getComputedStyle(el, which);
  if (!cs || cs.content === "none" || cs.content === "normal") return false;
  return ALPHA(cs.backgroundColor) || cs.backgroundImage !== "none";
}

function paints(el){
  const tag = el.tagName.toLowerCase();
  if (tag === "svg") return !el.parentElement.closest("svg");
  if (el.closest("svg")) return false;            // shapes inside a diagram travel with it
  if (tag === "img") return true;
  const cs = getComputedStyle(el);
  if (cs.visibility === "hidden" || cs.display === "none" || parseFloat(cs.opacity) === 0) return false;
  if (ALPHA(cs.backgroundColor)) return true;
  if (cs.backgroundImage !== "none") return true;
  if (cs.clipPath && cs.clipPath !== "none") return true;
  if (cs.boxShadow && cs.boxShadow !== "none") return true;
  if (cs.maskImage && cs.maskImage !== "none") return true;
  if (cs.webkitMaskImage && cs.webkitMaskImage !== "none") return true;
  for (const side of ["Top", "Right", "Bottom", "Left"]) {
    if (parseFloat(cs["border" + side + "Width"]) > 0 && ALPHA(cs["border" + side + "Color"])) return true;
  }
  return paintsPseudo(el, "::before") || paintsPseudo(el, "::after");
}

function kindOf(el){
  const tag = el.tagName.toLowerCase();
  if (tag === "svg" || tag === "img") return tag;
  const c = el.classList;
  for (const k of ["chamfer", "code-block", "diagonal-split", "axis-node", "axis",
                   "deck-footer", "qr-tile", "employer-mark", "speaker-photo",
                   "mascot", "waterfall", "flow-track", "wf-track"]) {
    if (c.contains(k)) return k.replace("code-block", "code").replace("chamfer", "card");
  }
  return "box";
}

function isText(el){
  if (!el.textContent || !el.textContent.trim()) return false;
  if (el.closest('svg')) return false;
  const kids = [...el.children].filter(c => c.textContent && c.textContent.trim());
  if (!kids.length) return true;
  const ownText = [...el.childNodes].some(n => n.nodeType === 3 && n.textContent.trim());
  if (!ownText) return false;
  return kids.every(c => getComputedStyle(c).display.startsWith('inline'));
}

(async () => {
  const res = await fetch('index.html', {cache:'no-store'});
  const doc = new DOMParser().parseFromString(await res.text(), 'text/html');
  const sections = [...doc.querySelectorAll('deck-stage > section')];
  const notes = JSON.parse(doc.querySelector('#speaker-notes').textContent);
  const host = document.getElementById('host');
  const model = [];

  sections.forEach((sec, i) => {
    const stage = document.createElement('deck-stage');
    stage.className = 'stage';
    const clone = sec.cloneNode(true);
    clone.style.position = 'absolute';
    clone.style.inset = '0';
    stage.appendChild(clone);
    host.appendChild(stage);
    const sb = stage.getBoundingClientRect();
    const box = el => { const r = el.getBoundingClientRect();
      return {x: Math.round(r.left-sb.left), y: Math.round(r.top-sb.top),
              w: Math.round(r.width), h: Math.round(r.height)}; };

    const els = [...clone.querySelectorAll("*")].filter(paints).map(el => {
      const b = box(el);
      return Object.assign({kind: kindOf(el), src: el.getAttribute("src") || null,
                            text: (el.textContent || "").trim().slice(0, 60)}, b);
    }).filter(e => e.w > 6 && e.h > 1);

    /* Composites read better whole than in pieces: the s3 timeline is a rule, four
       nodes and four labels. Every direct child of the section that contains paint
       is also exported, so the timeline arrives as one PNG as well as five. */
    const groups = [...clone.children].filter(el => {
      if (!el.getBoundingClientRect().width) return false;
      return paints(el) || el.querySelector("*") && [...el.querySelectorAll("*")].some(paints);
    }).map(el => Object.assign({kind: "group", src: null,
                                text: (el.textContent || "").trim().slice(0, 60)}, box(el)))
      .filter(g => g.w > 6 && g.h > 1);

    const text = [...clone.querySelectorAll('*')].filter(isText).map(el => {
      const cs = getComputedStyle(el);
      return Object.assign({
        t: el.textContent.replace(/\s+/g,' ').trim(),
        font: cs.fontFamily.split(',')[0].replace(/["']/g,''),
        size: Math.round(parseFloat(cs.fontSize)),
        weight: cs.fontWeight, color: cs.color,
        cls: el.className && el.className.baseVal === undefined ? el.className : '',
      }, box(el));
    }).sort((a,b) => (a.y - b.y) || (a.x - b.x));

    model.push({n: i+1, label: sec.getAttribute('data-label') || '', groups,
                ground: (sec.className.match(/ground-\w+/) || ['ground-paper'])[0],
                elements: els, text, note: notes[i] || ''});
  });

  document.getElementById('out').textContent = 'MODEL:' + JSON.stringify(model);
})();
</script>
</body>
</html>
