quarkus.http.port=8088

# The console is a demo surface that changes between rehearsals. Quarkus serves
# static resources as `immutable, max-age=86400` by default, so a browser that has
# seen an older index.html or markdown.js keeps using it and a normal reload will
# not even revalidate -- which looks exactly like a rendering bug on stage.
quarkus.http.static-resources.caching-enabled=false
quarkus.application.name=capybara-sre-agent

# --- Anthropic model ---
quarkus.langchain4j.anthropic.api-key=${ANTHROPIC_API_KEY}
quarkus.langchain4j.anthropic.chat-model.model-name=claude-sonnet-4-6
# The judge returns JSON, and a reply cut off at the token ceiling is not slightly worse
# JSON -- it is unparseable, so the verdict is lost entirely. The agent's own incident
# reports have grown long too. Explicit and generous beats relying on a default.
quarkus.langchain4j.anthropic.chat-model.max-tokens=4096
# NOT claude-sonnet-5. quarkus-langchain4j 1.12.2's Anthropic client sends `top_k`
# on every request, and claude-sonnet-5 rejects it:
#   invalid_request_error: `top_k` is deprecated for this model
# chat-model.top-k is an OptionalInt with no @WithDefault, and blanking it in
# config does not stop it being sent. Setup-cost finding for beat 4, not a
# telemetry problem — the conventions work identically on 4-6.
quarkus.langchain4j.anthropic.timeout=60s

# --- WHICH TOOL PATH: the beat-4 experiment ---
# "mcp"   → tools fetched over MCP  → TracingMcpClientListener → name only
# "local" → tools declared in-process → ToolSpanWrapper → arguments + result
# Both agents share one prompt and one CapybaraDatabase, so this is the only
# variable. Run the same incident under each and diff the execute_tool spans.
capybara.tools=${CAPYBARA_TOOLS:mcp}

# --- MCP client (name must match @McpToolBox("capybara-db")) ---
quarkus.langchain4j.mcp.capybara-db.transport-type=http
quarkus.langchain4j.mcp.capybara-db.url=${CAPYBARA_MCP_URL:http://localhost:8086/mcp/sse}
quarkus.langchain4j.mcp.capybara-db.tool-execution-timeout=60s

# --- OpenTelemetry: native gen_ai.* from the extension ---
quarkus.otel.exporter.otlp.endpoint=${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4317}
quarkus.otel.exporter.otlp.protocol=grpc
quarkus.otel.propagators=tracecontext,baggage

# --- Enable all three signals to flow to the collector ---
quarkus.otel.metrics.enabled=true
# The SDK default is 60s, which on stage means pressing the button and then waiting a
# minute in silence for the graph to move. 15s keeps the drop visible while you talk.
quarkus.otel.metric.export.interval=15s
quarkus.otel.logs.enabled=true

# --- FORENSIC CONTENT: opt-in, deliberately ON (the talk's "switch you throw") ---
quarkus.langchain4j.tracing.include-tool-arguments=true
quarkus.langchain4j.tracing.include-tool-result=true
quarkus.langchain4j.tracing.include-prompt=true
quarkus.langchain4j.tracing.include-completion=true

# --- Postgres: the real capybara database ---
# The app connects as capybara_app. Quarkus instruments the datasource, so each
# tool call shows up as a SQL span underneath the execute_tool span — which is the
# "the span you need next is the SQL span" argument, made visible.
# Datasource tracing is opt-in. Without this there are no SQL spans at all, which
# is worth knowing: "we use OTel" does not mean every layer is instrumented.
quarkus.datasource.jdbc.telemetry=true
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=capybara_app
quarkus.datasource.password=capybara_app
quarkus.datasource.jdbc.url=${CAPYBARA_DB_URL:jdbc:postgresql://localhost:5432/capybara}?ApplicationName=capybara-sre-agent

# --- The kangaroo's own credentials: the fault injector connects as itself ---
# A named datasource rather than a hand-rolled connection, so this write is traced
# like any other and the audit trail attributes it to the kangaroo role.
quarkus.datasource.kangaroo.jdbc.telemetry=true
quarkus.datasource.kangaroo.db-kind=postgresql
quarkus.datasource.kangaroo.username=kangaroo
quarkus.datasource.kangaroo.password=kangaroo
quarkus.datasource.kangaroo.jdbc.url=${CAPYBARA_DB_URL:jdbc:postgresql://localhost:5432/capybara}?ApplicationName=kangaroo-service

# --- Admin role, for the stage reset only ---
# Restoring the seed and clearing the audit trail needs privileges the application
# role must NOT have: if capybara_app could delete audit_log, the trail would not be
# tamper-proof and the demo's attribution would be worthless.
quarkus.datasource.admin.jdbc.telemetry=true
quarkus.datasource.admin.db-kind=postgresql
quarkus.datasource.admin.username=capybara
quarkus.datasource.admin.password=capybara
quarkus.datasource.admin.jdbc.url=${CAPYBARA_DB_URL:jdbc:postgresql://localhost:5432/capybara}?ApplicationName=stage-reset
