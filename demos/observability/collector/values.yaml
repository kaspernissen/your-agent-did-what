# The shared collector, used by both demos.
#
# gen_ai_normalizer is configured below but left out of the traces pipeline. Every agent
# now emits gen_ai.* itself: capybara-sre through its framework, otter-sre through
# OpenLLMetry, and beaver-sre through OpenInference's OPENINFERENCE_ENABLE_GENAI_SEMCONV
# (set in agents/k8s/beaver-sre.yaml). Measured side by side, OpenInference's own output
# covered every attribute the normalizer produced from the same spans, and more.
#
# Without the processor, otter-sre's hand-written agent and tool spans keep their call
# content in traceloop.entity.* only. Put gen_ai_normalizer back in the traces pipeline
# (here and in values.dash0.yaml / values.dynatrace.yaml, which restate it) to translate
# that at the collector again. It only rewrites the sources listed under `sources`, so
# spans already in gen_ai.* pass through untouched.
mode: deployment
replicaCount: 1
image:
  repository: otel/opentelemetry-collector-contrib
  tag: "0.158.0"
resources:
  limits: { memory: 512Mi }
  requests: { memory: 256Mi }

config:
  receivers:
    otlp:
      protocols:
        grpc: { endpoint: 0.0.0.0:4317 }
        http: { endpoint: 0.0.0.0:4318 }

  processors:
    batch:
      timeout: 5s
      send_batch_size: 1024
    gen_ai_normalizer:
      sources:
        # remove_originals: false on purpose. With it true the processor deletes each
        # attribute it managed to map, so the span that arrives shows only the leftovers
        # it could NOT translate -- which reads like the library emitted an odd subset.
        # Keeping the originals means one span carries both vocabularies side by side:
        # what the library said, and what the collector made of it. That comparison is
        # the demo.
        - name: openinference
          remove_originals: false
        - name: openllmetry
          remove_originals: false

  exporters:
    # kubectl logs the collector to read spans, exactly like the local demo's stdout.
    debug:
      verbosity: detailed
    otlp/jaeger:
      endpoint: jaeger:4317
      tls: { insecure: true }

    # Prometheus with --web.enable-otlp-receiver accepts OTLP directly, so metrics take
    # the same shape of path as traces: app -> collector -> backend. No scrape config,
    # no /metrics endpoint on the apps to expose.
    otlphttp/prometheus:
      endpoint: http://prometheus.observability.svc.cluster.local:9090/api/v1/otlp
      tls: { insecure: true }

  extensions:
    health_check:
      endpoint: 0.0.0.0:13133

  service:
    extensions: [health_check]
    pipelines:
      traces:
        receivers: [otlp]
        # Re-enable to translate OpenInference / OpenLLMetry at the collector instead:
        # processors: [gen_ai_normalizer, batch]
        processors: [batch]
        exporters: [debug, otlp/jaeger]
      metrics:
        receivers: [otlp]
        processors: [batch]
        exporters: [debug, otlphttp/prometheus]
      logs:
        receivers: [otlp]
        processors: [batch]
        exporters: [debug]
