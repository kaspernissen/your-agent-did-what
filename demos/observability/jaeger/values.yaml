# Jaeger v2 (chart 4.x): a single binary configured exactly like an OpenTelemetry
# Collector, which is the point the talk makes about where the plumbing has moved.
# Jaeger v1 reached end of life on 2025-12-31; running v1 here while saying that on
# stage would be a contradiction worth avoiding.
#
# One Service named `jaeger` carries every port. There is no separate collector,
# query or agent service to target: anything sending traces or opening the UI
# addresses `jaeger`.
#
# `storage.type` has no effect in v2; storage is declared in the config below.
# In-memory suits this demo, since the cluster is recreated for every run.
#
# Adapted from a working configuration in dash0/demos/otel-platform-demo, which in
# turn follows Jaeger's own Service Performance Monitoring reference.
fullnameOverride: jaeger

jaeger:
  image:
    # Jaeger's own registry, as the upstream docs use, which also keeps this off
    # Docker Hub's anonymous pull limits.
    registry: cr.jaegertracing.io
  resources:
    limits:
      memory: 400Mi
  # Let the cluster's Prometheus scrape the span metrics the connector produces on
  # :8889. That is what fills the Monitor tab.
  podAnnotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "8889"

# Surface the Monitor tab in the UI.
uiconfig:
  monitor:
    menuEnabled: true

userconfig:
  service:
    extensions: [jaeger_storage, jaeger_query, healthcheckv2]
    pipelines:
      traces:
        receivers: [otlp]
        processors: [batch]
        exporters: [jaeger_storage_exporter, span_metrics]
      metrics/spanmetrics:
        receivers: [span_metrics]
        exporters: [prometheus]
    telemetry:
      resource:
        service.name: jaeger
      metrics:
        level: detailed
        readers:
          - pull:
              exporter:
                prometheus:
                  host: 0.0.0.0
                  port: 8888
      logs:
        level: info

  extensions:
    healthcheckv2:
      use_v2: true
      http:
        # The chart's probes hit :13133/status. This has to bind 0.0.0.0 rather than
        # the default localhost, or the kubelet cannot reach it and the pod never
        # becomes ready.
        endpoint: 0.0.0.0:13133

    jaeger_query:
      storage:
        traces: memstore
        metrics: metricstore
      ui:
        # The chart renders `uiconfig` into a ConfigMap and mounts it here, but
        # nothing reads it unless the config points at the file.
        config_file: /etc/jaeger/ui-config.json

    jaeger_storage:
      backends:
        memstore:
          memory:
            max_traces: 5000
      metric_backends:
        metricstore:
          prometheus:
            endpoint: http://prometheus:9090
            # Prometheus exposes these as calls_total and
            # duration_milliseconds_bucket; without normalisation Jaeger looks for
            # calls and duration_bucket and finds nothing.
            normalize_calls: true
            normalize_duration: true

  connectors:
    span_metrics:

  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318

  processors:
    batch:

  exporters:
    jaeger_storage_exporter:
      trace_storage: memstore
    prometheus:
      endpoint: 0.0.0.0:8889
