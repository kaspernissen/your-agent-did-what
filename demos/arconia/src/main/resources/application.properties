spring.application.name=arconia-anthropic-demo
spring.ai.anthropic.api-key=${ANTHROPIC_API_KEY}

management.endpoints.web.exposure.include=*

# ── GenAI semantic-convention flavor ────────────────────────────────────────
# Flip this ONE property to re-emit spans under a different convention.
# Values (all require arconia-opentelemetry-ai-semantic-conventions on the classpath):
#   opentelemetry  → OTel GenAI semconv (gen_ai.* + gen_ai.provider.name)
#   openlit        → OpenLIT convention  (gen_ai.* + gen_ai.system)
#   openllmetry    → OpenLLMetry convention (gen_ai.* + traceloop.* keys)
#   langsmith      → LangSmith convention
# For OpenInference: swap the dep arconia-opentelemetry-ai-semantic-conventions
# for arconia-openinference-ai-semantic-conventions (see README).
arconia.observations.conventions.opentelemetry.ai.flavor=opentelemetry

arconia.observations.conventions.opentelemetry.ai.capture-content=SPAN_ATTRIBUTES
arconia.observations.conventions.opentelemetry.ai.include-tool-definitions=true
arconia.observations.conventions.opentelemetry.ai.include-tool-call-content=true

# ── OTLP export (traces only; metrics/logs disabled for local debug use) ────
# The Spring Boot / Arconia property for the OTLP trace endpoint is:
#   management.opentelemetry.tracing.export.otlp.endpoint
# (NOT arconia.otel.exporter.otlp.endpoint — that key does not exist in this version)
management.opentelemetry.tracing.export.otlp.endpoint=http://localhost:4318/v1/traces

management.tracing.sampling.probability=1.0
management.tracing.propagation.type=W3C,B3
