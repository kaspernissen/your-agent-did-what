receivers:
  otlp:
    protocols:
      grpc: { endpoint: 0.0.0.0:4317 }
      http: { endpoint: 0.0.0.0:4318 }

processors:
  gen_ai_normalizer:
    sources:
      - name: openinference
        remove_originals: true
      - name: openllmetry
        remove_originals: true

exporters:
  debug:
    verbosity: detailed
  # OpenLIT ingests OTLP/HTTP on 4318. The otlp exporter speaks gRPC, so this
  # must be otlphttp — pointing the gRPC exporter at 4318 fails to connect.
  otlphttp/openlit:
    endpoint: http://openlit:4318

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [gen_ai_normalizer]
      exporters: [debug, otlphttp/openlit]
