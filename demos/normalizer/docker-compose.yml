name: yadw-normalizer

services:
  collector:
    # gen_ai_normalizer ships in the released contrib image. No custom ocb build needed.
    image: otel/opentelemetry-collector-contrib:0.158.0
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./otel-collector-config.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "4317:4317"
      - "4318:4318"

  openlit-clickhouse:
    image: clickhouse/clickhouse-server:24.4.1
    environment:
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: OPENLIT
      CLICKHOUSE_DB: openlit
    ulimits:
      nofile:
        soft: 262144
        hard: 262144

  openlit:
    image: ghcr.io/openlit/openlit:latest
    depends_on: [openlit-clickhouse]
    environment:
      INIT_DB_HOST: openlit-clickhouse
      INIT_DB_PORT: "8123"
      INIT_DB_DATABASE: openlit
      INIT_DB_USERNAME: default
      INIT_DB_PASSWORD: OPENLIT
      SQLITE_DATABASE_URL: file:/app/client/data/data.db
    volumes:
      - openlit-data:/app/client/data
    ports:
      - "3001:3000"

volumes:
  openlit-data:
