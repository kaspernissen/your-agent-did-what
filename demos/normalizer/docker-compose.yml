name: yadw-normalizer

services:
  collector:
    # gen_ai_normalizer ships in otel/opentelemetry-collector-contrib:0.154.0+.
    # At the time of writing 0.154.0 is not yet released; use an ocb-built image
    # (see README.md "Building the collector") or pin to 0.154.0 once available.
    # To build locally: see builder-config.yaml and README.md.
    image: otel/opentelemetry-collector-contrib:0.154.0   # requires gen_ai_normalizer (0.154.0+) — or replace with an ocb-built image
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./otel-collector-config.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "4317:4317"
      - "4318:4318"

  openlit-clickhouse:
    image: clickhouse/clickhouse-server:24.4.1
    environment:
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: OPENLIT
      CLICKHOUSE_DB: openlit
    ulimits:
      nofile:
        soft: 262144
        hard: 262144

  openlit:
    image: ghcr.io/openlit/openlit:latest
    depends_on: [openlit-clickhouse]
    environment:
      INIT_DB_HOST: openlit-clickhouse
      INIT_DB_PORT: "8123"
      INIT_DB_DATABASE: openlit
      INIT_DB_USERNAME: default
      INIT_DB_PASSWORD: OPENLIT
    ports:
      - "3001:3000"
