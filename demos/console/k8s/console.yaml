# console — the page the demo is driven from, and the single origin in front of all three agents.
#
# Its own `frontend` namespace: it is not an agent, and the split says so. Reaching the
# agents across a namespace boundary costs nothing here, because nginx already addresses
# them by FQDN — its resolver ignores search domains, so short names were never an option.
#
# This is the only thing anyone port-forwards to run the demo. 01_start-demo.sh maps it to
# localhost:8088 — the port capybara-sre used when it served the page itself, so the URL on
# the slides did not have to change.
apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: frontend
  name: console
  labels: { app: console, demo: conventions }
spec:
  replicas: 1
  selector:
    matchLabels: { app: console }
  template:
    metadata:
      labels: { app: console, demo: conventions }
    spec:
      containers:
        - name: console
          image: console:latest
          imagePullPolicy: Never
          ports: [{ containerPort: 80 }]
          # Static files and a proxy. No API key, no database, no collector — if this pod
          # needs a secret, something has been put in the wrong place.
          readinessProbe:
            httpGet: { path: /healthz, port: 80 }
            initialDelaySeconds: 2
          resources:
            requests: { memory: 32Mi }
            limits:   { memory: 128Mi }
---
apiVersion: v1
kind: Service
metadata:
  namespace: frontend
  name: console
spec:
  selector: { app: console }
  ports: [{ port: 80, targetPort: 80 }]
