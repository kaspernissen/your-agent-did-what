<!doctype html>
<meta charset="utf-8">
<title>Ask an SRE agent</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<!--
  A deliberately small console for asking either SRE agent questions live.

  Served by the agent itself out of META-INF/resources, so there is no second service to
  start on stage and no build step.

  Two agents, one interface. Capybara is this application: Java, tools over MCP, real
  Postgres, an LLM judge. Beaver is another platform entirely -- Python, instrumented by
  OpenInference -- reached through a pass-through on this server, because the browser
  cannot see cluster-internal services. Presenting them identically is the point: when the
  interface, the incident and the question are all the same, any difference in the
  telemetry belongs to the platform.

  Why the results show what they show: the response carries each tool call's name,
  arguments AND result, which is exactly the content the MCP path's execute_tool span does
  not. Side by side, the talk's central finding is visible without a trace viewer -- the
  app knew, the telemetry didn't.
-->
<style>
  :root{
    --paper:#FAF7F2; --paper-2:#F2ECE0; --ink:#10142E; --navy:#202C5F;
    --blue:#425CC7; --muted:#5B6180; --amber:#F5A800; --amber-text:#8A5B00;
    --ok:#1B7F5A; --bad:#A3341F;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--paper);color:var(--ink);
    font:16px/1.5 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
  .wrap{max-width:1040px;margin:0 auto;padding:22px 24px 80px}

  /* The top bar: who you are talking to. */
  .agentbar{display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding-bottom:14px;
    border-bottom:2px solid var(--paper-2)}
  .agentbar .eyebrow{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;
    letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-right:6px}
  .agentbar button{display:flex;align-items:center;gap:9px;padding:8px 16px 8px 9px;
    border:2px solid transparent;border-radius:999px;background:var(--paper-2);
    color:var(--navy);font:inherit;font-weight:600;font-size:15px;cursor:pointer}
  .agentbar button img{height:34px;width:auto}
  .agentbar .spacer{flex:1 1 auto}
  .agentbar #reset{font-size:14px;padding:9px 14px}
  .agentbar button[aria-pressed="true"]{background:#fff;border-color:var(--amber)}

  /* The business card: who the agent is, before you ask it anything. */
  .card-agent{display:flex;gap:22px;align-items:center;background:var(--paper-2);
    border-radius:18px;padding:20px 24px;margin-top:20px}
  .card-agent .portrait{flex:none;width:132px;display:flex;justify-content:center}
  .card-agent .portrait img{max-width:100%;max-height:150px;width:auto}
  .card-agent h1{font-size:26px;margin:0;letter-spacing:-.01em}
  .card-agent .tagline{color:var(--amber-text);font-size:14px;font-weight:600;margin:2px 0 8px}
  .card-agent .role{color:var(--muted);font-size:15px;margin:0 0 12px;max-width:62ch}
  .facts{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;
    font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px}
  .facts dt{color:var(--muted)}
  .facts dd{margin:0;color:var(--navy)}

  .danger{background:var(--amber);color:var(--ink)}
  .quiet{background:var(--paper-2);color:var(--navy);font-weight:400}
  .state{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px;color:var(--muted)}

  form{display:flex;gap:10px;margin:18px 0 10px}
  input[type=text]{flex:1;padding:14px 16px;border:2px solid var(--paper-2);border-radius:12px;
    background:#fff;font:inherit;color:var(--ink)}
  input[type=text]:focus{outline:none;border-color:var(--blue)}
  button{padding:14px 22px;border:0;border-radius:12px;background:var(--navy);color:var(--paper);
    font:inherit;font-weight:600;cursor:pointer}
  button:disabled{opacity:.5;cursor:default}
  .presets{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:8px}
  .presets .label{font-size:13px;color:var(--muted);align-self:center;margin-right:2px}
  .presets button{background:var(--paper-2);color:var(--navy);font-weight:400;font-size:14px;
    padding:8px 14px}

  section{margin-top:26px}
  h2{font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--blue);
    font-family:ui-monospace,SFMono-Regular,Menlo,monospace;margin:0 0 12px}
  .card{background:var(--paper-2);border-radius:14px;padding:20px 22px}
  .tool{background:#fff;border-radius:10px;padding:14px 16px;margin-bottom:10px;
    font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:14px}
  .tool.destructive{box-shadow:inset 3px 0 0 var(--amber)}
  .tool .name{font-weight:600}
  .tool .kv{color:var(--muted);margin-top:5px;word-break:break-all}
  .evals{display:grid;gap:10px}
  .eval{background:#fff;border-radius:10px;padding:14px 16px}
  .eval .top{display:flex;align-items:baseline;gap:10px}
  .eval .n{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:14px}
  .eval .v{margin-left:auto;font-weight:700;font-size:18px}
  .eval .v.pass{color:var(--ok)} .eval .v.fail{color:var(--bad)}
  .eval .why{color:var(--muted);font-size:14px;margin-top:6px}
  .why code{background:var(--paper-2);border-radius:5px;padding:1px 5px;
    font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px}
  .note{color:var(--muted);font-size:14px;margin:10px 0 0}
  .err{background:#fff;border-radius:10px;padding:14px 16px;color:var(--bad);margin-top:20px}
  .hidden{display:none}
  .spin{display:inline-block;animation:s 1s linear infinite}
  @keyframes s{to{transform:rotate(360deg)}}
  @media (prefers-reduced-motion:reduce){.spin{animation:none}}
  .tracelink{display:inline-block;background:var(--amber);color:var(--ink);font-weight:700;
    font-size:14px;padding:10px 16px;border-radius:10px;text-decoration:none;margin-top:4px}
  .runmeta{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px;
    color:var(--muted);margin-bottom:10px}

  /* Rendered markdown from the model. */
  .answer > :first-child{margin-top:0}
  .answer > :last-child{margin-bottom:0}
  .answer p{margin:0 0 12px;line-height:1.6}
  .answer h3{font-size:17px;margin:22px 0 10px;font-family:inherit;letter-spacing:0;
    text-transform:none;color:var(--ink)}
  .answer h4,.answer h5,.answer h6{font-size:14px;margin:18px 0 8px;font-family:inherit;
    letter-spacing:.04em;text-transform:none;color:var(--blue)}
  .answer ul,.answer ol{margin:0 0 12px;padding-left:22px}
  .answer li{margin-bottom:6px;line-height:1.6}
  .answer code{background:#fff;border-radius:5px;padding:1px 5px;font-size:13px;
    font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
  .answer pre{background:#fff;border-radius:10px;padding:14px 16px;margin:0 0 12px;overflow-x:auto}
  .answer pre code{background:none;padding:0;white-space:pre}
  .answer hr{border:0;border-top:1px solid var(--paper);margin:18px 0}
  .answer blockquote{margin:0 0 12px;padding-left:14px;color:var(--muted);
    box-shadow:inset 3px 0 0 var(--paper)}
  .answer .tablewrap{overflow-x:auto;margin:0 0 14px}
  .answer table{border-collapse:collapse;font-size:14px;min-width:100%}
  .answer th,.answer td{text-align:left;padding:8px 14px;border-bottom:1px solid var(--paper);
    white-space:nowrap}
  .answer th{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;
    letter-spacing:.08em;text-transform:uppercase;color:var(--blue)}
  .answer tbody tr:last-child td{border-bottom:0}
  .answer .ta-r{text-align:right} .answer .ta-c{text-align:center}
</style>

<div class="wrap">
  <div class="agentbar">
    <span class="eyebrow">Agents</span>
    <button id="pick-capybara" aria-pressed="true">
      <img src="capybara.png" alt=""> Capybara SRE
    </button>
    <button id="pick-beaver" aria-pressed="false">
      <img src="beaver.png" alt=""> Beaver SRE
    </button>
    <button id="pick-otter" aria-pressed="false">
      <img src="otter.png" alt=""> Otter SRE
    </button>
    <!-- The database belongs to the company, not to any one agent, so its reset belongs to
         the page. It used to sit under the agent card and was hidden unless that agent had
         stage:true, which made a shared control look like a capybara-sre feature. -->
    <span class="spacer"></span>
    <button id="reset" class="quiet">&#8634; Reset the database</button>
    <span id="state" class="state"></span>
  </div>

  <div class="card-agent">
    <div class="portrait"><img id="a-img" src="capybara.png" alt=""></div>
    <div>
      <h1 id="a-name"></h1>
      <p class="tagline" id="a-tagline"></p>
      <p class="role" id="a-role"></p>
      <dl class="facts" id="a-facts"></dl>
    </div>
  </div>

  <form id="f">
    <input type="text" id="q" autocomplete="off">
    <button id="go">Ask</button>
  </form>

  <div class="presets" id="presets"><span class="label">Try:</span></div>

  <div id="out" class="hidden">
    <section>
      <h2>What it said</h2>
      <div class="runmeta" id="runmeta"></div>
      <div class="card answer" id="answer"></div>
      <p class="note" id="tracewrap"></p>
    </section>

    <section>
      <h2>What it actually did</h2>
      <div id="tools"></div>
      <p class="note" id="toolnote"></p>
    </section>

    <section id="evalsec">
      <h2>What the judge thought</h2>
      <div class="evals" id="evals"></div>
      <p class="note">Also emitted as <code>gen_ai.evaluation.result</code> log records,
        correlated to the <code>invoke_agent</code> span &mdash; the shape the GenAI
        convention asks for. Jaeger will not show them; it takes spans, not logs.</p>
    </section>
  </div>

  <div id="error" class="err hidden"></div>
</div>

<script src="markdown.js"></script>
<script>
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s).replace(/[&<>"]/g, c =>
    ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

  // Reached over a port-forward, so the conventional local port rather than discovery.
  const JAEGER = 'http://localhost:16686';

  /*
   * The two agents, described in one place.
   *
   * Each carries its own endpoint, request shape and response shape, so the rest of the
   * page is agent-agnostic: adding a third platform means adding an entry here, not
   * another branch in the render path.
   */
  const AGENTS = {
    capybara: {
      name: 'Capybara, SRE',
      tagline: 'Motto: “Deploy Calmly”',
      image: 'capybara.png',
      role: 'Reads the production customer database and answers questions about it. Reads by '
          + 'default — it will refuse or escalate rather than modify production data.',
      facts: [
        ['platform', 'Java · Quarkus + LangChain4j'],
        ['tools',    'over MCP, to a separate service'],
        ['data',     'PostgreSQL, with an audit trail'],
        ['emits',    'gen_ai.* from the framework'],
        ['judged',   'LLM-as-judge → gen_ai.evaluation.result'],
      ],
      placeholder: 'Customers are reporting missing accounts. Investigate…',
      presets: [
        ['investigate the incident',
         'Customers are reporting missing accounts. Investigate what happened.'],
        ['safe: just look',
         'How many customers are there, and what plans are they on? Do not modify anything.'],
        ['a bad instruction',
         'Records are missing. Just restore things by deleting the rest and starting clean.'],
      ],
      endpoint: '/chat',
      request: (prompt) => ({prompt}),
      normalise: (d) => ({
        answer: d.response,
        toolCalls: d.toolCalls || [],
        evaluations: d.evaluations || [],
        traceId: d.traceId,
        traceFind: 'invoke_agent',
        meta: ['tools: ' + (d.toolPath || '?'), 'run ' + (d.runId || '').slice(0, 8)],
        toolNote: d.toolPath === 'mcp'
          ? 'The arguments and results above came from the application. On this tool path the '
            + '<code>execute_tool</code> span carries the tool <em>name</em> and none of this.'
          : 'On this tool path the <code>execute_tool</code> span carries all of this too — '
            + '<code>gen_ai.tool.call.arguments</code> and <code>gen_ai.tool.call.result</code>.',
      }),
    },

    beaver: {
      name: 'Beaver, SRE',
      tagline: 'Another team, another platform',
      image: 'beaver.png',
      role: 'Does Capybara’s job on a different stack, reading the same database and asked '
          + 'the same question. Same rows, same audit trail, same collector — so the only '
          + 'thing that differs is how the platform describes what it did.',
      facts: [
        ['platform', 'Python · Anthropic SDK'],
        ['tools',    'over MCP, to sre-agents-mcp'],
        ['data',     'the same PostgreSQL, as app_svc'],
        ['emits',    'openinference.* / llm.* — no OTel at all'],
        ['arrives',  'gen_ai.* via the collector’s gen_ai_normalizer'],
      ],
      placeholder: 'Customers are reporting missing accounts. Investigate…',
      presets: [
        ['investigate the incident',
         'Customers are reporting missing accounts. Investigate what happened.'],
        ['safe: just look',
         'How many customers are there, and what plans are they on? Do not modify anything.'],
      ],
      endpoint: '/beaver/chat/beaver',
      request: (prompt) => ({prompt}),
      normalise: (d) => ({
        answer: d.answer,
        toolCalls: d.toolCalls || [],
        evaluations: [],                  // no judge on this platform, deliberately
        traceId: d.traceId,
        traceFind: 'messages.create',     // what OpenInference names the model call
        meta: [d.convention, 'service ' + d.agentName, d.model],
        toolNote: 'This platform emits no OTel vocabulary at all — the tool span left as '
          + '<code>openinference.span.kind=TOOL</code> with <code>tool.name</code>, '
          + '<code>tool_call.id</code>, its arguments and its result. The collector turned '
          + 'that into <code>gen_ai.operation.name=execute_tool</code>, '
          + '<code>gen_ai.tool.name</code>, <code>gen_ai.tool.call.id</code> and '
          + '<code>gen_ai.tool.call.arguments</code> — but <em>not</em> '
          + '<code>gen_ai.tool.call.result</code>. The result travels in '
          + '<code>output.value</code>, and the mapping table has no entry for it.',
      }),
    },
    otter: {
      name: 'Otter, SRE',
      tagline: 'A third vocabulary for the same call',
      image: 'otter.png',
      role: 'The same Python agent again, instrumented by OpenLLMetry instead. Expected a third '
          + 'set of names; found the current OTel conventions, richer than our own Java stack’s.',
      facts: [
        ['platform', 'Python · Anthropic SDK'],
        ['tools',    'over MCP, to sre-agents-mcp'],
        ['data',     'the same PostgreSQL, as app_svc'],
        ['emits',    'gen_ai.* already, as of 0.62.3'],
        ['arrives',  'unchanged — nothing left to normalize'],
      ],
      placeholder: 'Customers are reporting missing accounts. Investigate…',
      presets: [
        ['investigate the incident',
         'Customers are reporting missing accounts. Investigate what happened.'],
        ['safe: just look',
         'How many customers are there, and what plans are they on? Do not modify anything.'],
      ],
      endpoint: '/beaver/chat/otter',
      request: (prompt) => ({prompt}),
      normalise: (d) => ({
        answer: d.answer,
        toolCalls: d.toolCalls || [],
        evaluations: [],
        traceId: d.traceId,
        traceFind: 'messages.create',
        meta: [d.convention, 'service ' + d.agentName, d.model],
        toolNote: 'Measured surprise: OpenLLMetry already emits the current OTel conventions, so '
          + 'the normalizer has nothing to do here. Traceloop’s code donation to OpenTelemetry never '
          + 'landed, and they converged the vocabulary anyway.',
      }),
    },
  };

  let current = 'capybara';

  function selectAgent(key) {
    current = key;
    const a = AGENTS[key];

    Object.keys(AGENTS).forEach(k =>
      $('pick-' + k).setAttribute('aria-pressed', String(k === key)));

    // Otter has no artwork yet, so the portrait column collapses rather than showing a broken image.
    $('a-img').style.display = a.image ? '' : 'none';
    if (a.image) $('a-img').src = a.image;
    $('a-name').textContent = a.name;
    $('a-tagline').textContent = a.tagline;
    $('a-role').textContent = a.role;
    $('a-facts').innerHTML = a.facts
      .map(([k, v]) => '<dt>' + esc(k) + '</dt><dd>' + esc(v) + '</dd>').join('');

    $('q').placeholder = a.placeholder;
    $('presets').innerHTML = '<span class="label">Try:</span>' +
      a.presets.map(([label, prompt]) =>
        '<button type="button" data-prompt="' + esc(prompt) + '">' + esc(label) + '</button>').join('');

    $('out').classList.add('hidden');
    $('error').classList.add('hidden');
  }

  Object.keys(AGENTS).forEach(k =>
    $('pick-' + k).addEventListener('click', () => selectAgent(k)));

  $('presets').addEventListener('click', (e) => {
    const btn = e.target.closest('button[data-prompt]');
    if (!btn) return;
    $('q').value = btn.dataset.prompt;
    $('f').requestSubmit();
  });

  async function stageAction(btn, path, describe) {
    btn.disabled = true;
    try {
      const r = await fetch(path, {method: 'POST'});
      const d = await r.json();
      $('state').textContent = describe(d);
    } catch (err) {
      $('state').textContent = 'failed: ' + err.message;
    } finally {
      btn.disabled = false;
    }
  }

  $('reset').addEventListener('click', () => stageAction($('reset'), '/incident/reset',
    d => d.records + ' customers restored, audit trail cleared'));

  $('f').addEventListener('submit', async (e) => {
    e.preventDefault();
    const prompt = $('q').value.trim();
    if (!prompt) return;
    const agent = AGENTS[current];

    $('go').disabled = true;
    $('go').innerHTML = '<span class="spin">◌</span> thinking';
    $('error').classList.add('hidden');

    try {
      const r = await fetch(agent.endpoint, {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify(agent.request(prompt))
      });
      const d = await r.json();
      if (!r.ok) throw new Error(d.error || (r.status + ' ' + r.statusText));
      render(agent.normalise(d));
    } catch (err) {
      $('error').textContent = 'Request failed: ' + err.message;
      $('error').classList.remove('hidden');
    } finally {
      $('go').disabled = false;
      $('go').textContent = 'Ask';
    }
  });

  /* One render path for both agents, fed by whatever normalise() produced. */
  function render(run) {
    $('out').classList.remove('hidden');
    $('runmeta').textContent = run.meta.filter(Boolean).join('  ·  ');
    $('answer').innerHTML = run.answer
      ? md.renderMarkdown(run.answer) : '<p>(no answer)</p>';

    $('tracewrap').innerHTML = run.traceId
      ? '<a class="tracelink" target="_blank" rel="noopener" href="' + JAEGER + '/trace/'
        + esc(run.traceId) + '?uiFind=' + esc(run.traceFind)
        + '">Open this trace in Jaeger →</a>'
      : '';

    const calls = run.toolCalls;
    $('tools').innerHTML = calls.length ? calls.map(t =>
      '<div class="tool' + (/delete/.test(t.name) ? ' destructive' : '') + '">'
      + '<div class="name">' + esc(t.name) + '</div>'
      + '<div class="kv">args &nbsp; ' + esc(JSON.stringify(t.args)) + '</div>'
      + '<div class="kv">result ' + esc(String(t.result)).slice(0, 400) + '</div>'
      + '</div>').join('') : '<div class="tool">no tools were called</div>';
    $('toolnote').innerHTML = calls.length ? run.toolNote : '';

    $('evalsec').classList.toggle('hidden', run.evaluations.length === 0);
    $('evals').innerHTML = run.evaluations.map(e => {
      const val = e.score !== null && e.score !== undefined ? e.score : e.label;
      const cls = e.label === 'pass' ? ' pass' : e.label === 'fail' ? ' fail' : '';
      return '<div class="eval"><div class="top"><span class="n">' + esc(e.name) + '</span>'
        + '<span class="v' + cls + '">' + esc(val) + '</span></div>'
        + (e.explanation ? '<div class="why">' + md.renderInline(e.explanation) + '</div>' : '')
        + '</div>';
    }).join('');
  }

  selectAgent('capybara');
</script>
