quarkus.http.port=8088

# The console's assets change whenever this app is redeployed. Quarkus serves static
# resources as `immutable, max-age=86400` by default, so a browser that has seen an older
# index.html or markdown.js keeps using it and a normal reload will not even revalidate.
# The symptom is indistinguishable from a rendering bug in the page itself.
quarkus.http.static-resources.caching-enabled=false
quarkus.application.name=capybara-sre

# --- Anthropic model ---
quarkus.langchain4j.anthropic.api-key=${ANTHROPIC_API_KEY}
quarkus.langchain4j.anthropic.chat-model.model-name=claude-sonnet-4-6
# The judge returns JSON, and a reply cut off at the token ceiling is not slightly worse
# JSON -- it is unparseable, so the verdict is lost entirely. The agent's own incident
# reports have grown long too. Explicit and generous beats relying on a default.
quarkus.langchain4j.anthropic.chat-model.max-tokens=4096
# NOT claude-sonnet-5. quarkus-langchain4j 1.12.2's Anthropic client sends `top_k`
# on every request, and claude-sonnet-5 rejects it:
#   invalid_request_error: `top_k` is deprecated for this model
# chat-model.top-k is an OptionalInt with no @WithDefault, and blanking it in config does
# not stop it being sent, so the model is pinned rather than the parameter removed. This is
# a model-compatibility problem, not a telemetry one -- the conventions behave identically
# on either model.
quarkus.langchain4j.anthropic.timeout=60s

# --- WHICH TOOL PATH: the local-vs-MCP experiment ---
# "mcp"   → tools fetched over MCP  → TracingMcpClientListener → name only
# "local" → tools declared in-process → ToolSpanWrapper → arguments + result
# Both agents share one prompt and one CustomerDatabase, so this is the only
# variable. Run the same incident under each and diff the execute_tool spans.
agent.tools=${AGENT_TOOLS:mcp}

# --- MCP client (name must match @McpToolBox("production-db")) ---
# SSE, and staying on SSE having measured the alternative.
#
# The tool call's database work is not in the agent's trace: the server dispatches the call
# asynchronously and the tool runs outside the request's OTel context, so every SQL query
# starts its own root trace. Streamable HTTP was the obvious candidate fix -- the reply
# travels on the same request rather than on a channel opened earlier -- and it does not
# help. It makes correlation worse: the server emits no span for POST /mcp at all, so the
# one span that did correlate under SSE, POST /mcp/messages/:id, disappears too, and the
# SQL spans stay orphaned either way. Measured on 2026-08-11, in-cluster.
quarkus.langchain4j.mcp.production-db.transport-type=http
quarkus.langchain4j.mcp.production-db.url=${CUSTOMER_DB_MCP_URL:http://localhost:8086/mcp/sse}
quarkus.langchain4j.mcp.production-db.tool-execution-timeout=60s

# --- OpenTelemetry: native gen_ai.* from the extension ---
quarkus.otel.exporter.otlp.endpoint=${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4317}
quarkus.otel.exporter.otlp.protocol=grpc
quarkus.otel.propagators=tracecontext,baggage

# --- Enable all three signals to flow to the collector ---
quarkus.otel.metrics.enabled=true
# The SDK default is 60s, so a change in the data can take a full minute to reach a graph.
# 15s trades a little more traffic for a gauge that responds while you are still looking
# at it.
quarkus.otel.metric.export.interval=15s
quarkus.otel.logs.enabled=true

# --- Tool-call content: opt-in, and deliberately on ---
# The conventions define arguments and results as opt-in, and instrumentation SHOULD NOT
# capture them by default, for privacy and payload size. Without these flags a span proves
# a tool ran but not what it did. Think before copying them into an application handling
# real user data.
quarkus.langchain4j.tracing.include-tool-arguments=true
quarkus.langchain4j.tracing.include-tool-result=true
# These two produce gen_ai.prompt and gen_ai.completion, which the registry REMOVED in favour
# of gen_ai.input.messages and gen_ai.output.messages. The extension has no support for the
# replacements, so the choice is the old keys or no message content at all. Left on: the
# content is worth more than the key names, and the mismatch is worth knowing about.
quarkus.langchain4j.tracing.include-prompt=true
quarkus.langchain4j.tracing.include-completion=true

# --- Postgres: the real customer database ---
# The app connects as app_svc. Quarkus instruments the datasource, so each
# tool call shows up as a SQL span underneath the execute_tool span — which is the
# "the span you need next is the SQL span" argument, made visible.
# Datasource tracing is opt-in. Without this there are no SQL spans at all, which
# is worth knowing: "we use OTel" does not mean every layer is instrumented.
quarkus.datasource.jdbc.telemetry=true
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=app_svc
quarkus.datasource.password=app_svc
quarkus.datasource.jdbc.url=${CUSTOMER_DB_URL:jdbc:postgresql://localhost:5432/production}?ApplicationName=capybara-sre

# --- The service account's credentials: the rehearsal endpoint connects as it ---
# A named datasource rather than a hand-rolled connection, so this write is traced
# like any other and the audit trail attributes it to the deploy_svc role.
quarkus.datasource.deploy.jdbc.telemetry=true
quarkus.datasource.deploy.db-kind=postgresql
quarkus.datasource.deploy.username=deploy_svc
quarkus.datasource.deploy.password=deploy_svc
quarkus.datasource.deploy.jdbc.url=${CUSTOMER_DB_URL:jdbc:postgresql://localhost:5432/production}?ApplicationName=goose

# --- Admin role, for the stage reset only ---
# Restoring the seed and clearing the audit trail needs privileges the application
# role must NOT have: if app_svc could delete audit_log, the trail would not be
# tamper-proof and the demo's attribution would be worthless.
quarkus.datasource.admin.jdbc.telemetry=true
quarkus.datasource.admin.db-kind=postgresql
quarkus.datasource.admin.username=postgres
quarkus.datasource.admin.password=postgres
quarkus.datasource.admin.jdbc.url=${CUSTOMER_DB_URL:jdbc:postgresql://localhost:5432/production}?ApplicationName=stage-reset
