quarkus.http.port=8086
quarkus.mcp.server.sse.root-path=/mcp

# Server-side MCP tracing. Off by default, which is why the far side of every tool call was
# a blank in the trace: the client showed "tools/call list_records" and nothing explained
# what the server did with it.
#
# 1.13.1 rather than 1.10.6 for this. It also reads traceparent out of the JSON-RPC _meta
# envelope (McpMetaTextMapGetter), which is how MCP is meant to carry context when the
# transport cannot.
quarkus.mcp.server.tracing.enabled=true
quarkus.mcp.server.metrics.enabled=true

# --- Postgres: the real capybara database ---
# The app connects as capybara_app. Quarkus instruments the datasource, so each
# tool call shows up as a SQL span underneath the execute_tool span — which is the
# "the span you need next is the SQL span" argument, made visible.
# Datasource tracing is opt-in. Without this there are no SQL spans at all, which
# is worth knowing: "we use OTel" does not mean every layer is instrumented.
quarkus.datasource.jdbc.telemetry=true
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=capybara_app
quarkus.datasource.password=capybara_app
quarkus.datasource.jdbc.url=${CAPYBARA_DB_URL:jdbc:postgresql://localhost:5432/capybara}?ApplicationName=capybara-db-mcp

# --- OpenTelemetry: the MCP server is a service in its own right ---
# Without this the tool call vanishes at the process boundary: the agent shows a
# client span and nothing explains what happened on the other side.
quarkus.application.name=capybara-db-mcp
quarkus.otel.exporter.otlp.endpoint=${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4317}
quarkus.otel.exporter.otlp.protocol=grpc
quarkus.otel.propagators=tracecontext,baggage
