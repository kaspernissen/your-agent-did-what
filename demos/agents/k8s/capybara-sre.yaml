apiVersion: apps/v1
kind: Deployment
metadata:
  name: capybara-sre
  labels:
    app: capybara-sre
spec:
  replicas: 1
  selector:
    matchLabels:
      app: capybara-sre
  template:
    metadata:
      labels:
        app: capybara-sre
    spec:
      containers:
        - name: capybara-sre
          image: capybara-sre:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8088
          env:
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: anthropic-secret
                  key: api-key
            - name: CUSTOMER_DB_MCP_URL
              value: "http://sre-agents-mcp:8086/mcp/sse"
            # One variable serves all three datasources — app, deploy and admin —
            # because each appends its own ApplicationName to this base URL.
            - name: CUSTOMER_DB_URL
              value: "jdbc:postgresql://production-db:5432/production"
            # mcp (default) or local: which instrumentation sees the tool call.
            - name: AGENT_TOOLS
              value: "mcp"
            - name: OTEL_JAVAAGENT_ENABLED
              value: "false"
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: grpc
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://otel-collector-opentelemetry-collector.default.svc.cluster.local:4317"
          livenessProbe:
            httpGet:
              path: /q/health
              port: 8088
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /q/health
              port: 8088
            initialDelaySeconds: 15
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: capybara-sre
  labels:
    app: capybara-sre
spec:
  selector:
    app: capybara-sre
  ports:
    - port: 8088
      targetPort: 8088
      protocol: TCP
  type: ClusterIP
