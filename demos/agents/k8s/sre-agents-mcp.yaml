apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: db
  name: sre-agents-mcp
  labels:
    app: sre-agents-mcp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sre-agents-mcp
  template:
    metadata:
      labels:
        app: sre-agents-mcp
    spec:
      containers:
        - name: sre-agents-mcp
          image: customer-db-mcp:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8086
          env:
            - name: CUSTOMER_DB_URL
              value: "jdbc:postgresql://production-db.db.svc.cluster.local:5432/production"
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: grpc
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://otel-collector-opentelemetry-collector.observability.svc.cluster.local:4317"
          livenessProbe:
            httpGet:
              path: /q/health
              port: 8086
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /q/health
              port: 8086
            initialDelaySeconds: 10
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  namespace: db
  name: sre-agents-mcp
  labels:
    app: sre-agents-mcp
spec:
  selector:
    app: sre-agents-mcp
  ports:
    - port: 8086
      targetPort: 8086
      protocol: TCP
  type: ClusterIP
