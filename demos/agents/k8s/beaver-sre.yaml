# Beaver SRE — the same job as Capybara SRE, on a different platform.
#
# Capybara is Java: Quarkus + LangChain4j, tools over MCP, talking to Postgres.
# Beaver is Python: the Anthropic SDK instrumented by OpenInference. Same incident,
# same question, same collector. Different animal, different stack, different
# telemetry vocabulary.
#
# OpenInference on purpose, and it is the whole demo: the library emits llm.* and
# gen_ai_normalizer rewrites part of it, so ONE span arrives carrying both
# vocabularies at once. That single span is the thing to point at.
#
# The image still supports CAPYBARA_INSTRUMENTATION=openlit|none for anyone who wants
# the other side locally (see agent/run.sh); it is simply not deployed, because a
# second agent nobody demos is a second service cluttering Jaeger's dropdown.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: beaver-sre
  labels: { app: beaver-sre, demo: conventions }
spec:
  replicas: 1
  selector:
    matchLabels: { app: beaver-sre }
  template:
    metadata:
      labels: { app: beaver-sre, demo: conventions }
    spec:
      containers:
        - name: agent
          image: beaver-sre:latest
          imagePullPolicy: Never
          ports: [{ containerPort: 8000 }]
          env:
            - { name: CAPYBARA_INSTRUMENTATION, value: openinference }
            - { name: CAPYBARA_AGENT_NAME,      value: beaver-sre }
            # The same database Capybara reads, as the same application role. Both agents
            # then report on identical state rather than on separate fictions.
            - { name: CAPYBARA_DB_DSN,
                value: "postgresql://capybara_app:capybara_app@capybara-db:5432/capybara" }
            - { name: OTEL_EXPORTER_OTLP_ENDPOINT,
                value: http://otel-collector-opentelemetry-collector.default.svc:4318 }
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef: { name: anthropic-secret, key: api-key }
          readinessProbe:
            httpGet: { path: /healthz, port: 8000 }
            initialDelaySeconds: 3
          resources:
            requests: { memory: 256Mi }
            limits:   { memory: 512Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: beaver-sre
spec:
  selector: { app: beaver-sre }
  ports: [{ port: 8000, targetPort: 8000 }]
