# beaver-sre — the Python agent instrumented by OpenInference.
#
# Its own image now, built from demos/agents/beaver-sre. ../otter-sre is the same agent with
# OpenLLMetry instead: same loop, same tools, same MCP server, one library different. That is
# the comparison the talk rests on, so keep the two manifests identical apart from the image
# and OPENINFERENCE_ENABLE_GENAI_SEMCONV, which is part of configuring the library.
apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: agents
  name: beaver-sre
  labels: { app: beaver-sre, demo: conventions }
spec:
  replicas: 1
  selector:
    matchLabels: { app: beaver-sre }
  template:
    metadata:
      labels: { app: beaver-sre, demo: conventions }
    spec:
      containers:
        - name: agent
          image: beaver-sre:latest
          imagePullPolicy: Never
          ports: [{ containerPort: 8000 }]
          env:
            - { name: AGENT_NAME,      value: beaver-sre }
            # OpenInference writes OTel GenAI attributes (gen_ai.*) next to its own llm.* /
            # openinference.* when each span ends. Needs openinference-instrumentation >= 0.1.51.
            # Without it this agent emits no gen_ai.* at all, because the collector no longer
            # runs gen_ai_normalizer. Known upstream gap: gen_ai.tool.call.arguments is filled
            # from tool.parameters, so it carries the tool's JSON schema, not the call's
            # arguments. The arguments are still in tool_call.function.arguments / input.value.
            - { name: OPENINFERENCE_ENABLE_GENAI_SEMCONV, value: "true" }
            # The same database Capybara reads, as the same application role. Both agents
            # then report on identical state rather than on separate fictions.
            # The same MCP server Capybara uses, so all three agents execute their tools in
            # the same other process and differ only in what emits the telemetry. Remove this
            # and the DSN below takes over, reading the table directly.
            - { name: CUSTOMER_DB_MCP_URL, value: http://sre-agents-mcp.db.svc.cluster.local:8086/mcp }
            - { name: CUSTOMER_DB_DSN,
                value: "postgresql://app_svc:app_svc@production-db.db.svc.cluster.local:5432/production" }
            - { name: OTEL_EXPORTER_OTLP_ENDPOINT,
                value: http://otel-collector-opentelemetry-collector.observability.svc.cluster.local:4318 }
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef: { name: anthropic-secret, key: api-key }
          readinessProbe:
            httpGet: { path: /healthz, port: 8000 }
            initialDelaySeconds: 3
          resources:
            requests: { memory: 256Mi }
            limits:   { memory: 512Mi }
---
apiVersion: v1
kind: Service
metadata:
  namespace: agents
  name: beaver-sre
spec:
  selector: { app: beaver-sre }
  ports: [{ port: 8000, targetPort: 8000 }]