enabled: true
fullnameOverride: jaeger
provisionDataStore:
  cassandra: false
allInOne:
  enabled: true
  args:
    - "--memory.max-traces=5000"
  extraEnv:
    - name: COLLECTOR_OTLP_GRPC_HOST_PORT
      value: 0.0.0.0:4317
    - name: COLLECTOR_OTLP_HTTP_HOST_PORT
      value: 0.0.0.0:4318
  resources:
    limits:
      memory: 400Mi
storage:
  type: memory
agent:
  enabled: false
collector:
  enabled: false
query:
  enabled: false
