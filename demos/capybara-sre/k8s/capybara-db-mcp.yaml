apiVersion: apps/v1
kind: Deployment
metadata:
  name: capybara-db-mcp
  labels:
    app: capybara-db-mcp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: capybara-db-mcp
  template:
    metadata:
      labels:
        app: capybara-db-mcp
    spec:
      containers:
        - name: capybara-db-mcp
          image: capybara-db-mcp:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8086
          livenessProbe:
            httpGet:
              path: /health
              port: 8086
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8086
            initialDelaySeconds: 10
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: capybara-db-mcp
  labels:
    app: capybara-db-mcp
spec:
  selector:
    app: capybara-db-mcp
  ports:
    - port: 8086
      targetPort: 8086
      protocol: TCP
  type: ClusterIP
