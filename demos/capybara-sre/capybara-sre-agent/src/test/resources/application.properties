# Dummy API key for hermetic tests — the CapybaraSreAgent bean is mocked via @InjectMock
quarkus.langchain4j.anthropic.api-key=dummy-test-key

# Disable MCP client startup in test mode (no MCP server running)
quarkus.langchain4j.mcp.capybara-db.transport-type=stdio
quarkus.langchain4j.mcp.capybara-db.command=echo

# Disable OTel export in tests (no collector running)
quarkus.otel.sdk.disabled=true
